<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/touches.css">
</head>
<body>
<script src="/app.js"></script>
<script src="/nugget.js"></script>
<script src="/touches.js" defer></script>
<script>renderNav("/reels");</script>
<main>
  <p class="brand" id="brand" hidden></p>
  <section class="pagehead rise">
    <h1 class="title">Reels</h1>
    <div class="saybox"><span id="sum-nugget"></span><p class="say" id="sum">Loading…</p></div>
  </section>
  <div id="filters" role="group" aria-label="Show" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <section class="hero tall rise" id="hero" aria-label="Your best Highlights" tabindex="0" hidden style="animation-delay:.06s"></section>
  <div class="sechead" id="mhead" hidden><h2 class="h2">Matches</h2><span class="lbl">Newest first</span></div>
  <div id="matches" style="display:flex;flex-direction:column;gap:18px"></div>
  <div class="emptybig rise" id="empty" hidden>
    <span data-nugget-full="idle"></span>
    <h2>No Reels yet</h2>
    <p>Grab a Demo with a 3K or better and Nugget films its Highlights. They land here once they're rendered.</p>
    <a class="primary" href="/demos">Demos to grab</a>
  </div>
</main>
<script>
// Reels (spec: Pages -> Reels): every match's Highlights. A click on a Highlight plays it from your view in a
// player that opens under it; the player switches to the Enemy POV, and shares: Copy file (paste it into Discord),
// an export that fits Discord, a 9:16 one, and Show in folder.
const HEIGHT = {ACE: 36, "5K": 36, "4K": 30, "3K": 24, "2K": 18};
// The two views a Reel can be rendered from: the words of its button and of the toasts about it.
const VIEWS = {
  player: {ask: "Render your view", busy: "Rendering your view…", name: "Your view"},
  enemy: {ask: "Render Enemy POV", busy: "Rendering Enemy POV…", name: "Enemy POV"},
};
let data = [];
let shown = null;    // the /api/reels text now on screen, so a poll that finds the same thing leaves the page be
let filter = "all";
const closed = new Set(JSON.parse(sessionStorage.getItem("closed") || "[]"));
const carousel = Carousel(document.getElementById("hero"), {onPlay: id => playById(id, true)});

const typeOf = h => String(h.type).toUpperCase();
// On a phone (or any other device) the page only watches and downloads: everything else is the PC's.
const PC = onThisPC();
if (!PC) {
  const b = document.getElementById("brand");
  b.hidden = false;
  b.innerHTML = `${MARK}<span>CS2 Clipper</span><a class="more" href="/demos" style="margin-left:auto">Demos to grab${ICON.next}</a>`;
}
document.querySelectorAll("[data-nugget-full]").forEach(n => { n.outerHTML = NUGGET.svg(n.dataset.nuggetFull, "Nugget, asleep on his egg"); });
// Each Highlight's kind as a comic burst: an Ace is the loudest.
const BURST_FILL = {ACE: "#FF5500", "5K": "#FF5500", "4K": "#F2EFEA", "3K": "#FFB27A", "2K": "#8F857A"};
const hitBurst = type => `<span class="hitb" title="${esc(type)}">${NUGGET.burst(type === "5K" ? "ACE!" : esc(type) + "!", BURST_FILL[type] || "#8F857A")}</span>`;
let sumMood = "";
const keep = h => filter === "all" || (filter === "hs" ? (h.reasons || []).some(r => /all headshots/i.test(r)) : typeOf(h) === filter);
function resultLabel(result) { return result ? result.charAt(0).toUpperCase() + result.slice(1) : ""; }
function rounds(score) {
  const parts = String(score).split(/[^0-9]+/).filter(Boolean).map(Number);
  return Math.max(1, parts.reduce((a, b) => a + b, 0));
}

// One Highlight: the whole row plays it, from your view when it has one. What the hover scrub flicks through
// (touches.js) is the same Reel.
function highlightRow(h) {
  const tags = reasonTags(h).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const first = h.player ?? h.enemy, secs = h.player !== null ? h.player_s : h.enemy_s;
  const views = [h.player !== null ? "Your view" : "", h.enemy !== null ? "Enemy POV" : ""].filter(Boolean).join(" · ");
  return `<div class="hl" data-round="${+h.round}" data-player="${h.player ?? ""}" data-enemy="${h.enemy ?? ""}"${first !== null ? ` data-scrub="${+first}" data-secs="${+secs || 0}"` : ""}>
    <span class="rd">Round ${+h.round}</span>${hitBurst(typeOf(h))}
    <span class="tags">${tags}<span class="views">${esc(views)}</span></span>
    <button class="pov play" data-reel="${first}" aria-label="Play round ${+h.round}">${ICON.play}Play</button>
  </div>`;
}

// The player under a Highlight: the video, the views it has, and the ways to share the one playing.
function playerPanel(row) {
  const has = view => row.dataset[view] !== "";
  const toggle = has("player") && has("enemy")
    ? `<span class="seg sm" role="radiogroup" aria-label="View"><button type="button" role="radio" data-view="player">Your view</button><button type="button" role="radio" data-view="enemy">Enemy POV</button></span>`
    : `<span class="help">${has("player") ? "Your view" : "Enemy POV"}</span>`;
  const tools = PC ? `
      <button class="ghost sm" type="button" data-share="copy" title="Put the file on the clipboard: paste it straight into Discord">Copy file</button>
      <button class="primary sm" type="button" data-share="discord" title="A copy under Discord's 20 MB, on the clipboard">Export for Discord</button>
      <button class="ghost sm" type="button" data-share="vertical" title="1080x1920 for TikTok, Shorts and Instagram Reels">9:16</button>
      <button class="ghost sm" type="button" data-share="reveal">${ICON.folder}Show in folder</button>`
    : '<a class="primary sm" id="download" href="#" download>Download</a>';
  return `<div class="player" id="player"><video id="player-video" controls autoplay playsinline></video>
    <div class="ptools">${toggle}<span class="spacer"></span>${tools}</div></div>`;
}

// The footer's render buttons (on the PC). A view that can be asked for now gets a button; a view that is rendering gets a
// disabled one in its place; a view in neither list gets nothing. The disabled one turns pointer events back on
// (app.css switches them off for disabled ghosts) so that its title shows on hover.
function renderButtons(m) {
  if (!PC) return "";
  return Object.keys(VIEWS).map(view => {
    if ((m.rendering || []).includes(view))
      return `<button class="ghost" disabled style="pointer-events:auto" title="Its Reels appear here when CS2 has recorded it">${VIEWS[view].busy}</button>`;
    if ((m.can_render || []).includes(view))
      return `<button class="ghost" data-render="${esc(view)}">${ICON.play}${VIEWS[view].ask}</button>`;
    return "";
  }).join("");
}

function matchBlock(m) {
  const rows = m.highlights.filter(keep);
  const byRound = {};
  m.highlights.forEach(h => { byRound[h.round] = h; });
  const cells = Array.from({length: rounds(m.score)}, (_, i) => {
    const h = byRound[i + 1];
    return h ? `<span class="cell ${keep(h) ? "on" : "dim"}" style="height:${HEIGHT[typeOf(h)] || 18}px" title="Round ${i + 1}"></span>` : '<span class="cell"></span>';
  }).join("");
  const won = m.result === "win";
  return `<section class="mcard${closed.has(m.checksum) ? "" : " open"}" data-checksum="${esc(m.checksum)}" aria-label="${esc(m.map)}, ${dateLabel(m.played_at)}">
    <button class="mhead" data-toggle aria-expanded="${!closed.has(m.checksum)}">
      <span class="maptile" style="width:54px;height:54px;font-size:21px">${mapAbbr(m.map)}</span>
      <span class="nm"><b>${esc(m.map)}</b><small>${dateLabel(m.played_at)}, ${plural(m.highlights.length, "Highlight")}</small></span>
      <span class="sc" style="color:${won ? "#F2EFEA" : "#8F857A"}"><b>${esc(m.score)}</b><small>${esc(resultLabel(m.result))}</small></span>
      <span class="strip-w" aria-hidden="true"><span class="rstrip">${cells}</span><span class="ends"><span>Round 1</span><span>Round ${rounds(m.score)}</span></span></span>
      ${ICON.chev}
    </button>
    <div class="collapse"><div>
      ${rows.length ? rows.map(highlightRow).join("") : '<p class="empty" style="padding:16px 22px">No Highlights of this kind in this match.</p>'}
      ${PC ? `<div class="mfoot">${renderButtons(m)}<button class="ghost" data-open="${esc(m.checksum)}">${ICON.folder}Open folder</button></div>` : ""}
    </div></div>
  </section>`;
}

function renderFilters() {
  const all = data.flatMap(m => m.highlights);
  const defs = [["all", "All"], ["ACE", "Aces"], ["4K", "4K"], ["3K", "3K"], ["2K", "2K"], ["hs", "All headshots"]];
  document.getElementById("filters").innerHTML = defs.map(([id, label]) => {
    const n = all.filter(h => id === "all" || (id === "hs" ? (h.reasons || []).some(r => /all headshots/i.test(r)) : typeOf(h) === id)).length;
    return n || id === "all" ? `<button class="chip${filter === id ? " on" : ""}" data-filter="${id}" aria-pressed="${filter === id}">${label}<span class="n">${n}</span></button>` : "";
  }).join("");
}

function renderSlides() {
  const best = bestHighlights(data, 5);
  document.getElementById("hero").hidden = !best.length;
  carousel.set(best.map(h => {
    const type = typeOf(h), name = type === "ACE" ? "Ace" : type, tags = reasonTags(h);
    return {key: `${h.match.checksum}-${h.round}`, type, tab: `${name}, ${h.match.map}`, thumb: h.player ?? h.enemy,
      meta: `${h.match.map}, ${dateLabel(h.match.played_at)}, ${h.match.result === "win" ? "won" : h.match.result === "loss" ? "lost" : ""} ${h.match.score}`,
      title: `${name} in round ${h.round}`, sub: tags.length ? tags.join(", ") + "." : "",
      acts: [...(h.player !== null ? [{label: "Watch", primary: true, play: h.player}] : []),
        ...(h.enemy !== null ? [{label: "Enemy POV", primary: h.player === null, play: h.enemy}] : [])]};
  }));
}

function render() {
  const all = data.flatMap(m => m.highlights);
  document.getElementById("sum").textContent = data.length
    ? `${plural(all.length, "Highlight")} from ${plural(data.length, "match", "matches")}. Click one to watch it and share it.`
    : "No Reels yet. Finished Demos show up here.";
  const mood = data.length ? "ace" : "idle";
  if (mood !== sumMood) { sumMood = mood; document.getElementById("sum-nugget").innerHTML = NUGGET.head(mood); }
  document.getElementById("mhead").hidden = !data.length;
  document.getElementById("empty").hidden = data.length > 0;
  renderFilters();
  renderSlides();
  sync(document.getElementById("matches"), data.filter(m => filter === "all" || m.highlights.some(keep)), m => m.checksum, matchBlock);
}

// A render replaces the changed matches, and the player sits inside one: never while a Reel plays or is shared.
let sharing = 0;
function playing() {
  const video = document.getElementById("player-video");
  return sharing > 0 || video !== null && !video.paused && !video.ended;
}

async function load() {
  try {
    const response = await api("api/reels");
    if (!response.ok) return;
    const text = await response.text();
    if (text === shown || playing()) return;      // nothing new, or a Reel is playing: the next poll looks again
    data = JSON.parse(text);
    shown = text;
    render();
  } catch (e) {
    if (playing()) return;
    shown = null;                                  // what is on screen is no longer what the server said
    document.getElementById("sum").textContent = "Can't reach CS2 Clipper right now. Is it running?";
  }
}

// Asks the server for a view that no Reel has yet (spec: Pages, Reels). On 202 the page reloads, and the button
// reads as rendering. On anything else the server's words go in a toast and the button comes back.
async function askRender(button) {
  const view = button.dataset.render;
  button.disabled = true;
  let response;
  try {
    response = await api(`api/reels/${button.closest(".mcard").dataset.checksum}/render`, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({perspective: view}),
    });
  } catch (e) {
    button.disabled = false;
    toast(`${ICON.info}<span>Couldn't reach CS2 Clipper. Is it running?</span>`);
    return;
  }
  if (response.status === 202) {
    toast(`${ICON.check}<span>${VIEWS[view].name} queued. CS2 records it next, after a heads-up.</span>`);
    await load();                                  // the 5-second reloads show its Reels once it is done
    return;
  }
  let message = "";
  try { message = (await response.json()).error; } catch (e) { /* a 404 has no body */ }
  button.disabled = false;
  toast(`${ICON.info}<span>${esc(message || "Couldn't queue it. Try again.")}</span>`);
  await load();
}

// The player's sound on the PC. CS2 records Reels at full volume, so they start at 30% until the slider is moved, and
// from then on where it was left: each new player takes the last one's level (and its mute, while the page is
// open). The app keeps the level, since this window forgets what a page stores each time it closes. A phone is left
// to its own volume buttons.
const sound = {volume: 0.3, muted: false};
let volumeSave = 0;
async function loadVolume() {
  try {
    const response = await api("api/reels/volume");
    const saved = response.ok ? (await response.json()).volume : null;
    if (typeof saved === "number") sound.volume = saved;
  } catch (e) { /* the quieter start stays */ }
}
function keepSound(video) {
  video.volume = sound.volume;
  video.muted = sound.muted;
  video.addEventListener("volumechange", () => {
    sound.muted = video.muted;
    if (video.volume === sound.volume) return;      // the level set just above, or only the mute changed
    sound.volume = video.volume;
    clearTimeout(volumeSave);                       // one save once the slider stops, not one per step of a drag
    volumeSave = setTimeout(() => api("api/reels/volume", {method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({volume: sound.volume})}).catch(() => {}), 400);
  });
}

// Plays Reel `id` of `row` in the player under it, which it opens (or moves there).
let playingReel = null;
function showReel(row, id) {
  let panel = document.getElementById("player");
  if (!panel || panel.previousElementSibling !== row) {
    panel?.remove();
    row.insertAdjacentHTML("afterend", playerPanel(row));    // under the row that was clicked
    panel = document.getElementById("player");
    if (PC) keepSound(document.getElementById("player-video"));
  }
  document.querySelectorAll(".hl.on, .pov.on").forEach(n => n.classList.remove("on"));
  row.classList.add("on");
  row.querySelector(".pov")?.classList.add("on");
  playingReel = +id;
  panel.querySelectorAll("[data-view]").forEach(b => {
    const on = +row.dataset[b.dataset.view] === playingReel;
    b.classList.toggle("on", on); b.setAttribute("aria-checked", on);
  });
  const video = document.getElementById("player-video");
  video.src = `/reels/${playingReel}.mp4`;
  const download = document.getElementById("download");
  if (download) download.href = `/reels/${playingReel}.mp4?download=1`;
  video.play().catch(() => {});      // `paused` is false from here on, even while the file loads
}

const rowOf = id => document.querySelector(`.hl[data-player="${+id}"], .hl[data-enemy="${+id}"]`);

// Plays a Reel by id: from the carousel, or from a toast's or Status's "Watch" (?play=<id>).
function playById(id, scroll) {
  const row = rowOf(id);
  if (!row) return false;
  const card = row.closest(".mcard");
  if (!card.classList.contains("open")) toggle(card);
  showReel(row, id);
  if (scroll) setTimeout(() => row.scrollIntoView({behavior: "smooth", block: "center"}), 120);
  return true;
}

// Copy file, the two exports and Show in folder, for the Reel playing. An export takes a few seconds: its button
// says so, and the page keeps still meanwhile.
const SHARE_WORDS = {copy: "Copying…", discord: "Exporting…", vertical: "Exporting…", reveal: "Opening…"};
async function shareReel(button) {
  const what = button.dataset.share, id = playingReel, label = button.innerHTML;
  if (id === null) return;
  button.disabled = true; button.textContent = SHARE_WORDS[what]; sharing++;
  try {
    const exporting = what === "discord" || what === "vertical";
    const response = await api(`api/reels/${id}/${exporting ? "export" : what}`, {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(exporting ? {kind: what} : {})});
    const data = await response.json().catch(() => ({}));
    if (!response.ok) toast(`${ICON.info}<span>${esc(data.error || "That Reel's file is gone.")}</span>`, 5000);
    else if (what === "copy") toast(`${ICON.check}<span>Copied. Paste it into Discord, or anywhere a file goes.</span>`, 4000);
    else if (what === "discord") toast(`${ICON.check}<span>${esc(data.file)}, ${data.mb} MB${data.copied ? ": copied, so paste it into Discord" : ", in Exports"}.</span>`, 6000);
    else if (what === "vertical") toast(`${ICON.check}<span>${esc(data.file)} is in Exports, ready for TikTok, Shorts and Reels.</span>`, 6000);
  } catch (e) {
    toast(`${ICON.info}<span>Couldn't reach CS2 Clipper. Is it running?</span>`);
  } finally {
    sharing--; button.disabled = false; button.innerHTML = label;
  }
}

function toggle(card) {
  const open = card.classList.toggle("open");
  card.querySelector("[data-toggle]").setAttribute("aria-expanded", open);
  const id = card.dataset.checksum;
  if (open) closed.delete(id); else closed.add(id);
  sessionStorage.setItem("closed", JSON.stringify([...closed]));
}

document.addEventListener("click", async e => {
  const f = e.target.closest("[data-filter]");
  if (f) {
    if (playing()) document.getElementById("player-video").pause();
    filter = f.dataset.filter;
    document.getElementById("matches")._ready = false;   // a new filter is not news: no flashes
    render();
    return;
  }
  const head = e.target.closest("[data-toggle]");
  if (head) { toggle(head.closest(".mcard")); return; }
  const openButton = e.target.closest("button[data-open]");
  if (openButton) {
    openButton.disabled = true;
    await api(`api/reels/${openButton.dataset.open}/open-folder`, {method: "POST"});
    openButton.disabled = false;
    return;
  }
  const renderButton = e.target.closest("button[data-render]");
  if (renderButton && !renderButton.disabled) { await askRender(renderButton); return; }
  const shareButton = e.target.closest("button[data-share]");
  if (shareButton && !shareButton.disabled) { await shareReel(shareButton); return; }
  const view = e.target.closest("button[data-view]");
  if (view) { const row = view.closest(".player").previousElementSibling; showReel(row, row.dataset[view.dataset.view]); return; }
  const row = e.target.closest(".hl");
  if (row && row.dataset.scrub) showReel(row, row.querySelector(".pov").dataset.reel);
});

(async () => {
  await Promise.all([load(), PC && loadVolume()]);      // a Reel asked for by ?play= starts at the kept level
  const wanted = new URLSearchParams(location.search).get("play");
  if (wanted && playById(wanted, true)) history.replaceState(null, "", location.pathname);
})();
every(5000, load, 30000);
</script>
</body>
</html>
