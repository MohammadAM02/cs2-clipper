# Builds the installer on one of GitHub's Windows machines, proves it there, and publishes it.
#
# A tag like `v0.1.0` publishes dist\CS2Clipper-Setup.exe as a Release. A pull request that touches the
# app or its packaging, and a run started by hand from the Actions tab, build and prove the same and
# publish nothing: the installer is kept with the run for two weeks.
#
# The machine has never seen the app, which is what the proof needs: packaging\prove.ps1 installs the
# app, runs its real setup, upgrades over a running copy, and uninstalls. Nothing is published unless
# every step before it passed.
#
# Adapted from thelifeofsuleyman/cs2-clipper's `.github/workflows/release.yml` (MIT). What we changed:
# uv instead of pip, one Windows job that tests, builds and proves, the Inno Setup the machine already
# has instead of a Chocolatey install, no portable zip and no bundled FFmpeg, pull requests build too,
# the tag has to be the exe's version, the installer is proved before it is published, a second job
# that alone may write publishes with GitHub's own `gh` instead of a third-party action, and old
# releases are kept.
#
