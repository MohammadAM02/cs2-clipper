<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<script src="/app.js"></script>
<script>renderNav("/settings");</script>
<main>
  <p class="brand"><span>CS2</span>clipper</p>
  <h1>Settings</h1>
  <div id="notice"></div>
  <div id="faceit"></div>
  <form id="form"></form>
  <p><button class="skip" id="save" type="button">Save</button> <span id="result"></span></p>
</main>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let fields = [], values = {}, faceitKeySet = false, keyRemoved = false, loginUrl = "", signInNote = "";

function inputFor(f) {
  const id = `f-${f.name}`;
  const value = values[f.name];
  if (f.kind === "secret") {
    const status = faceitKeySet
      ? '<span class="muted">A key is saved.</span> <button type="button" class="skip" data-remove-key="1">Remove key</button>'
      : "";
    return `<input type="password" id="${id}" autocomplete="new-password"> ${status}`;
  }
  if (f.kind === "bool") {
    return `<input type="checkbox" id="${id}" ${value ? "checked" : ""}>`;
  }
  if (f.kind === "choice") {
    const options = f.choices.map(c => `<option value="${esc(c)}"${c === value ? " selected" : ""}>${esc(c)}</option>`);
    return `<select id="${id}">${options.join("")}</select>`;
  }
  if (f.kind === "int" || f.kind === "number") {
    const min = f.minimum === null ? "" : `min="${f.minimum}"`;
    const max = f.maximum === null ? "" : `max="${f.maximum}"`;
    const step = f.kind === "int" ? "1" : "any";
    return `<input type="number" id="${id}" value="${esc(value)}" ${min} ${max} step="${step}">`;
  }
  return `<input type="text" id="${id}" value="${esc(value)}">`;
}

function fieldRow(f) {
  const note = f.name === "data_root"
    ? '<p class="note">A new folder applies to Demos from now on; files already in the old one stay.</p>' : "";
  const help = f.help ? `<small>${esc(f.help)}</small>` : "";
  // Nobody knows their SteamID64: the button asks FACEIT for it and fills both fields in.
  const lookup = f.name === "faceit_nickname"
    ? '<button type="button" class="skip" data-lookup="1">Look up my FACEIT name</button>' : "";
  return `<p class="field">
    <label for="f-${f.name}">${esc(f.label)}</label>
    ${inputFor(f)}
    ${lookup}
    ${help}
    <span class="err" id="err-${f.name}"></span>
  </p>${note}`;
}

// Sign in with FACEIT fills in the nickname and SteamID below; without a client ID there is no button.
function faceitBlock() {
  if (!loginUrl) return "";
  const signedIn = values.faceit_nickname
    ? `<span class="muted">Signed in as <b>${esc(values.faceit_nickname)}</b>.</span>` : "";
  const note = signInNote ? `<p class="note">${signInNote}</p>` : "";
  return `<h2>FACEIT sign-in</h2>
    <p class="field"><a class="skip" href="${esc(loginUrl)}">Sign in with FACEIT</a> ${signedIn}</p>
    ${note}`;
}

function render() {
  const groups = [];
  for (const f of fields) {
    let group = groups.find(g => g.name === f.group);
    if (!group) { group = {name: f.group, fields: []}; groups.push(group); }
    group.fields.push(f);
  }
  document.getElementById("form").innerHTML = groups
    .map(g => `<h2>${esc(g.name)}</h2>${g.fields.map(fieldRow).join("")}`).join("");
  document.getElementById("faceit").innerHTML = faceitBlock();
}

async function load() {
  const response = await api("api/settings");
  const data = await response.json();
  fields = data.fields;
  values = data.values;
  faceitKeySet = data.faceit_key_set;
  loginUrl = data.faceit_login_url || "";
  keyRemoved = false;
  document.getElementById("notice").innerHTML = data.warnings.length
    ? `<ul>${data.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : "";
  render();
}

function readField(f) {
  const el = document.getElementById(`f-${f.name}`);
  if (f.kind === "bool") return el.checked;
  if (f.kind === "int") return el.value === "" ? null : parseInt(el.value, 10);
  if (f.kind === "number") return el.value === "" ? null : parseFloat(el.value);
  return el.value;
}

// FACEIT sends the user back with ?code=…&state=… (the fragment too, if a relay forwards it that
// way); hand the code to the app, then never keep it in the address bar. Runs before load(), so the
// state still matches what the app minted.
async function finishSignIn() {
  const query = new URLSearchParams(location.search);
  const fragment = new URLSearchParams(location.hash.slice(1));
  const code = query.get("code") || fragment.get("code");
  const error = query.get("error") || fragment.get("error");
  const state = query.get("state") || fragment.get("state") || "";
  if (!code && !error) return;
  history.replaceState(null, "", location.pathname);
  if (error) {
    signInNote = `FACEIT sign-in failed: ${esc(error)}`;
    return;
  }
  const response = await api("api/faceit/session", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({code, state}),
  });
  const data = await response.json().catch(() => ({}));
  signInNote = response.ok ? `Signed in as <b>${esc(data.nickname)}</b>.`
    : `FACEIT sign-in failed: ${esc(data.error || "try again")}`;
}

// Asks the app to resolve the typed FACEIT name; it saves the nickname and the SteamID itself, so
// load() afterwards is what fills the boxes in.
async function lookupName() {
  const err = document.getElementById("err-faceit_nickname");
  const result = document.getElementById("result");
  const nickname = (document.getElementById("f-faceit_nickname").value || "").trim();
  err.textContent = "";
  if (!nickname) {
    err.textContent = "type your FACEIT name first";
    return;
  }
  const response = await api("api/faceit/lookup", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({nickname}),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    err.textContent = data.error || "FACEIT lookup failed";
    return;
  }
  await load();
  result.textContent = `Found ${data.nickname}.`;
}

document.getElementById("form").addEventListener("click", async e => {
  if (e.target.closest("button[data-lookup]")) {
    await lookupName();
    return;
  }
  if (e.target.closest("button[data-remove-key]")) {
    keyRemoved = true;
    faceitKeySet = false;
    render();
  }
});

document.getElementById("save").addEventListener("click", async () => {
  const changes = {};
  for (const f of fields) {
    if (f.kind === "secret") {
      const typed = document.getElementById(`f-${f.name}`).value;
      if (typed) changes[f.name] = typed;
      else if (keyRemoved) changes[f.name] = null;
      continue;
    }
    changes[f.name] = readField(f);
  }
  const response = await api("api/settings", {
    method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(changes),
  });
  const data = await response.json();
  const result = document.getElementById("result");
  document.querySelectorAll(".err").forEach(el => el.textContent = "");
  if (response.status === 400) {
    result.textContent = "";
    for (const [name, message] of Object.entries(data.errors || {})) {
      const el = document.getElementById(`err-${name}`);
      if (el) el.textContent = message;
    }
    return;
  }
  result.textContent = data.restart_needed ? "Saved. The port changes at the next start." : "Saved.";
  load();
});

(async () => { await finishSignIn(); await load(); })();
</script>
</body>
</html>
