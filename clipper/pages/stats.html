<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/touches.css">
<style>
  /* The Stats page's own pieces; the colours, type, frames, tables and Mistakes are app.css's. */
  .scorecard { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin: 6px 0 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 12px 14px; min-width: 0; border-radius:var(--r); }
  .tile .k { font: 700 12px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font: 700 30px var(--ui); color: var(--ink); margin-top: 2px; white-space: nowrap; }
  .tile .d { font: 600 13px var(--ui); margin-top: 2px; min-height: 18px; color: var(--dim); }
  .arrow.good { color: var(--good); } .arrow.bad { color: var(--bad); }
  .src { font: 700 11px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .round { border: 1px solid var(--line); border-radius: 0; background: var(--panel); margin-bottom: 10px; border-radius:var(--r); }
  .round summary { cursor: pointer; padding: 12px 16px; font: 700 17px var(--ui); letter-spacing: .04em; }
  .round[open] summary { border-bottom: 1px solid var(--line); }
  .events { list-style: none; margin: 0; padding: 6px 16px 12px; }
  .events li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font: 600 15px var(--ui); }
  .events li:last-child { border-bottom: 0; }
  .events .t { color: var(--muted); font-family: var(--mono); font-size: 13px; min-width: 52px; }
  .events .weapon { color: var(--muted); }
  .events .tag { font-size: 12px; }
  .events .watch { margin-left: auto; color: var(--accent); text-decoration: none; font-weight: 700; }
  .events .watch:hover { text-decoration: underline; }
  .events .noclip { margin-left: auto; color: var(--dim); font-size: 13px; }
  main .note { margin: 8px 0 14px; }
  @media (max-width: 640px) { .tile .v { font-size: 26px; } }
</style>
</head>
<body>
<script src="/app.js"></script>
<script src="/touches.js" defer></script>
<script>renderNav("/reels");</script>
<main>
  <p><a class="back" href="/reels">← Reels</a></p>
  <section class="pagehead rise">
    <h1 class="title" id="title">Stats</h1>
    <p class="say" id="say">Loading…</p>
  </section>
  <div id="body"></div>
</main>
<script>
// Stats (spec: Stats): one match. The scorecard is your player; under it are your Mistakes, each with what to try
// next time; the table is all ten; the timeline is each round, and each kill links to its Reel at the kill's moment
// when the Reel has it. Nothing here runs anything: the page reads the match's stats, and the stats were worked out
// when the match was analyzed.
const checksum = new URLSearchParams(location.search).get("match") || "";
let view = null;
let sortKey = "rating", sortDir = -1;

const pct = v => (v === null || v === undefined) ? "–" : `${v}%`;
const num = v => (v === null || v === undefined) ? "–" : String(v);
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
// csda's end reason, as the page shows it: the reason as csda wrote it, until the names are mapped.
const endReason = raw => String(raw ?? "");

function nameOf(steamId) {
  const p = view.players.find(x => x.steam_id === steamId);
  return p ? p.name : "World";
}
function youOf() { return view.players.find(p => p.you) || null; }

// The change against the average of the subject's last matches with stats: up is more, and for deaths more is worse.
function arrow(metric, lowerIsBetter = false, unit = "") {
  const d = view.comparison?.deltas?.[metric];
  if (d === null || d === undefined) return "";
  if (d === 0) return `<span class="arrow" aria-label="level with your average">= avg</span>`;
  const up = d > 0, good = lowerIsBetter ? !up : up;
  return `<span class="arrow ${good ? "good" : "bad"}" aria-label="${up ? "up" : "down"} ${Math.abs(d)}${unit} against your average">${up ? "▲" : "▼"} ${Math.abs(d)}${unit}</span>`;
}

function tile(label, value, delta, source) {
  return `<div class="tile"><div class="k">${esc(label)}</div><div class="v">${value}</div>` +
    `<div class="d">${delta || ""}</div>${source ? `<div class="src">${esc(source)}</div>` : ""}</div>`;
}

// Your numbers: FACEIT's official ones when the match has FACEIT's line, and where FACEIT reports nothing (KAST,
// trades) the demo's. Each tile says where its number comes from.
function scorecard(you) {
  const o = you.official, src = o.source === "faceit" ? "FACEIT" : "Demo";
  return `<div class="scorecard" aria-label="Your scorecard">` +
    tile("K–D–A", `${num(o.kills)}–${num(o.deaths)}–${num(o.assists)}`,
      `${arrow("kills")} ${arrow("deaths", true)}`, src) +
    tile("Rating 2.1", o.rating === null ? "–" : o.rating.toFixed(2), arrow("rating"), "HLTV 2.1, estimated") +
    tile("K/D", o.kd === null ? "–" : Number(o.kd).toFixed(2), arrow("kd"), src) +
    tile("ADR", num(o.adr), arrow("adr"), src) +
    tile("HS%", pct(o.hs_pct), arrow("hs_pct", false, " pts"), src) +
    tile("KAST", pct(o.kast_pct), "", "Demo") +
    tile("Entry", o.entry_pct === null ? "–" : pct(o.entry_pct), `${num(o.entry_won)} of ${plural(o.entry_tried || 0, "duel")} won`, src) +
    tile("Multi-kills", multiText(o.multi_kills), "2K · 3K · 4K · 5K rounds", src) +
    tile("Clutches", `${num(o.clutch_won)}/${num(o.clutch_tried)}`, `${o.clutch_kind} won`, src) +
    tile("Utility", num(o.utility_damage), `damage · ${num(o.enemies_flashed)} flashed`, src) +
    `</div>`;
}

// Rounds with 2, 3, 4 and 5 Frags: shown as "3 · 1 · 0 · 0", and ranked by aces first, then 4Ks, 3Ks and 2Ks.
const MULTI = ["2", "3", "4", "5"];
const multiText = m => MULTI.map(k => num(m?.[k])).join(" · ");
const multiRank = m => [...MULTI].reverse().reduce((rank, k) => rank * 100 + (m?.[k] ?? 0), 0);

// Each column's group: "official" is FACEIT's number when the match has FACEIT's line (else the demo's); "here" is
// worked out by the app from the Demo: the rating, KAST and trades, which FACEIT does not report.
const ratio = (won, tried) => tried ? `${num(won)}/${num(tried)}` : "–";
const COLUMNS = [
  {key: "name", label: "Player", get: p => p.name, text: true},
  {key: "kills", label: "K", group: "official", get: p => p.official.kills},
  {key: "deaths", label: "D", group: "official", get: p => p.official.deaths},
  {key: "assists", label: "A", group: "official", get: p => p.official.assists},
  {key: "kd", label: "K/D", group: "official", get: p => p.official.kd, show: p => p.official.kd === null ? "–" : Number(p.official.kd).toFixed(2)},
  {key: "adr", label: "ADR", group: "official", get: p => p.official.adr},
  {key: "hs_pct", label: "HS%", group: "official", get: p => p.official.hs_pct, show: p => pct(p.official.hs_pct)},
  {key: "entry", label: "Entry", group: "official", get: p => p.official.entry_pct,
    show: p => ratio(p.official.entry_won, p.official.entry_tried)},
  {key: "multi", label: "2K·3K·4K·5K", group: "official", get: p => multiRank(p.official.multi_kills),
    show: p => multiText(p.official.multi_kills)},
  {key: "flashed", label: "Flashed", group: "official", get: p => p.official.enemies_flashed},
  {key: "utility", label: "Util dmg", group: "official", get: p => p.official.utility_damage},
  {key: "clutch", label: "Clutch", group: "official", get: p => p.official.clutch_won,
    show: p => ratio(p.official.clutch_won, p.official.clutch_tried)},
  {key: "rating", label: "Rating 2.1", group: "here", get: p => p.official.rating,
    show: p => p.official.rating === null ? "–" : p.official.rating.toFixed(2)},
  {key: "kast_pct", label: "KAST", group: "here", get: p => p.official.kast_pct, show: p => pct(p.official.kast_pct)},
  {key: "trades", label: "Trades", group: "here", get: p => p.official.trade_kills,
    show: p => `${p.official.trade_kills} / ${p.official.traded_deaths}`},
];

// The row above the column names: where the official columns come from in this match, then the app's own.
function groupRow() {
  const lead = COLUMNS.filter(c => c.group === "official").length, rest = COLUMNS.filter(c => c.group === "here").length;
  const sources = new Set(view.players.map(p => p.official.source));
  const label = !sources.has("faceit") ? "From the demo: FACEIT has no stats for this match yet"
    : sources.has("demo") ? "FACEIT's official stats (the demo's where FACEIT has none)" : "FACEIT's official stats";
  return `<tr class="grp"><th></th><th colspan="${lead}">${label}</th><th colspan="${rest}">From the demo</th></tr>`;
}

function table() {
  const col = COLUMNS.find(c => c.key === sortKey) || COLUMNS[1];
  const key = p => { const v = col.get(p); return v === null || v === undefined ? (col.text ? "" : -Infinity) : v; };
  const rows = [...view.players].sort((a, b) => {
    const x = key(a), y = key(b);
    if (x === y) return 0;
    return (x > y ? 1 : -1) * sortDir;
  });
  const heads = COLUMNS.map(c => {
    const aria = c.key === sortKey ? (sortDir > 0 ? "ascending" : "descending") : "none";
    return `<th scope="col"><button class="sort" data-key="${c.key}" aria-sort="${aria}">${esc(c.label)}</button></th>`;
  }).join("");
  const body = rows.map(p => {
    const cells = COLUMNS.map(c => {
      if (c.key === "name") {
        return `<td><span class="team ${p.team === youOf()?.team ? "a" : ""}"></span>${esc(p.name)}${p.you ? ' <span class="tag">you</span>' : ""}</td>`;
      }
      return `<td>${esc(c.show ? c.show(p) : num(c.get(p)))}</td>`;
    }).join("");
    return `<tr class="${p.you ? "you" : ""}">${cells}</tr>`;
  }).join("");
  return `<div class="wrap"><table class="tbl" aria-label="All players in this match"><thead>${groupRow()}<tr>${heads}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function eventRow(e) {
  const at = `<span class="t">${mmss(e.t)}</span>`;
  if (e.type !== "kill") {
    const what = e.type === "bomb_planted" ? "Bomb planted" : e.type === "bomb_defused" ? "Bomb defused" : "Bomb exploded";
    return `<li>${at}<span>${esc(what)}${e.site ? ` at ${esc(e.site)}` : ""}${e.player ? ` by ${esc(nameOf(e.player))}` : ""}</span></li>`;
  }
  const tags = [e.headshot ? "HS" : "", e.trade ? "Trade" : "", e.flash_assist ? "Flash assist" : ""]
    .filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join(" ");
  const clip = (e.clips || []).find(c => c.perspective === "player") || (e.clips || [])[0];
  const watch = clip ? `<a class="watch" href="/reels?play=${+clip.reel_id}&t=${clip.seconds}">Watch</a>`
                     : `<span class="noclip">no Reel for this moment</span>`;
  return `<li>${at}<span><b>${esc(e.killer ? nameOf(e.killer) : "World")}</b> <span class="weapon">${esc(e.weapon)}</span> <b>${esc(nameOf(e.victim))}</b></span>${tags}${watch}</li>`;
}

function timeline() {
  const you = youOf();
  return view.rounds.map(r => {
    const who = you && r.winner === you.team ? "You won" : "Enemy won";
    return `<details class="round"${r.number === 1 ? " open" : ""}><summary>Round ${r.number} · ${who} · ${esc(endReason(r.end_reason))}</summary>` +
      `<ol class="events">${r.events.length ? r.events.map(eventRow).join("") : '<li class="note">No kills or bomb events.</li>'}</ol>` +
      `<p class="note" style="padding:0 16px 12px"><a class="watch" href="/replay?match=${encodeURIComponent(checksum)}&round=${r.number}">Replay this round</a></p></details>`;
  }).join("");
}

// Your Mistakes in the match, in the order they happened: when, what it was, what happened, and what to try next time.
// Watch plays the moment in a Reel that has it (a death's own, with Clip your deaths on); Replay draws the round.
function mistakes() {
  const m = view.mistakes;
  if (!m) return "";
  const heat = `<a class="more" href="/heatmaps?match=${encodeURIComponent(checksum)}">Heatmap of this match ${ICON.next}</a>`;
  const late = m.flashes_kept ? "" : `<p class="note">This match was analyzed before the app kept flashes, so no team flash is looked for in it yet. The app reads it again while CS2 is closed.</p>`;
  if (!m.list.length) {
    return `<div class="sechead"><h2 class="h2">Mistakes</h2><span class="lbl">None found in this match</span>${heat}</div>${late || '<p class="note">Not one. Clean.</p>'}`;
  }
  const items = m.list.map(x => {
    const clip = x.clips && x.clips[0];
    return `<li class="mistake"><div class="when"><b>Round ${+x.round}</b>${mmss(x.t)} in</div>
      <div><h3>${esc(x.title)}</h3><p>${esc(x.detail)}</p><p class="tip">${esc(x.tip)}</p></div>
      <div class="acts">${clip ? `<a href="/reels?play=${+clip.reel_id}&t=${clip.seconds}">Watch</a>` : ""}<a href="/replay?match=${encodeURIComponent(checksum)}&round=${+x.round}">Replay</a></div></li>`;
  }).join("");
  return `<div class="sechead"><h2 class="h2">Mistakes</h2><span class="lbl">${plural(m.list.length, "moment")} that cost you, and what to try next time</span>${heat}</div>
    <ul class="mlist" style="margin:8px 0 ${late ? 8 : 22}px">${items}</ul>${late}`;
}

function render() {
  const body = document.getElementById("body");
  const title = document.getElementById("title"), say = document.getElementById("say");
  title.textContent = `${mapName(view.map)}, ${dateLabel(view.played_at)}`;
  const won = view.result === "win";
  if (view.state !== "ready") {
    say.textContent = "This match's stats are still being worked out.";
    body.innerHTML = `<div class="emptybig rise"><h2>Not yet</h2><p>The stats of this match are worked out once CS2 and FACEIT AC are both closed. They appear here then.</p></div>`;
    return;
  }
  say.textContent = `${view.team_score}–${view.opponent_score}, ${won ? "a win" : view.result === "loss" ? "a loss" : "a tie"}.` +
    (view.faceit ? " The numbers are FACEIT's official stats." : " FACEIT has no stats for this match yet, so the numbers are the demo's.");
  const you = youOf();
  const parts = [];
  if (you) {
    const c = view.comparison;
    parts.push(`<div class="sechead"><h2 class="h2">You</h2><span class="lbl">${c && c.count ? `Against your last ${plural(c.count, "match", "matches")} with stats` : "No earlier matches with stats to compare with"}</span></div>`);
    parts.push(scorecard(you));
    parts.push(mistakes());
  } else {
    parts.push(`<p class="note">Set your SteamID in Settings to see your scorecard here.</p>`);
  }
  parts.push(`<div class="sechead"><h2 class="h2">All ten</h2><span class="lbl">Click a column to sort</span></div>`);
  parts.push(table());
  parts.push(`<p class="note">FACEIT's numbers are its official match stats, as its match page shows them. FACEIT reports no KAST or trades, so those are worked out here from the Demo, as is Rating 2.1: HLTV's formula is not public, so it is an estimate from KAST, kills, deaths, assists and ADR. Clutches are FACEIT's 1v1s and 1v2s.</p>`);
  parts.push(`<div class="sechead"><h2 class="h2">Rounds</h2><span class="lbl">Kills link to their Reel when it has the moment</span></div>`);
  parts.push(timeline());
  body.innerHTML = parts.join("");
}

document.getElementById("body").addEventListener("click", e => {
  const button = e.target.closest("button.sort");
  if (!button) return;
  const key = button.dataset.key;
  sortDir = key === sortKey ? -sortDir : (key === "name" ? 1 : -1);
  sortKey = key;
  document.getElementById("body").querySelector(".wrap").outerHTML = table();
});

async function load() {
  if (!checksum) { document.getElementById("say").textContent = "No match asked for."; return; }
  const response = await api(`api/stats/${encodeURIComponent(checksum)}`);
  if (!response.ok) {
    document.getElementById("say").textContent = response.status === 404 ? "No such match." : "The stats could not be read.";
    return;
  }
  view = await response.json();
  render();
}
load();
</script>
</body>
</html>
