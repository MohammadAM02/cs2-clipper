[project]
name = "cs2-clipper"
version = "0.2.0"
description = "Hands-off CS2 highlight clipper: a FACEIT Demo in, Reels out."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "psutil>=6.0",
    "zstandard>=0.23",
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
    "pythonnet>=3.1.0 ; sys_platform == 'win32'",
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.9",
]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg and ffprobe on PATH (skipped when missing)",
]
