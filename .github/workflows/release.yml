name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - clipper/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Run the tests
        run: uv run pytest -q

      # Both scripts are written for Windows PowerShell 5.1, and tried under it: so it runs them here,
      # not PowerShell 7. Inno Setup 6 is on the machine already.
      - name: Build the app and its installer
        shell: powershell
        run: .\packaging\build.ps1 -Installer

      - name: The tag is the exe's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = (Get-Item dist\CS2Clipper.exe).VersionInfo.ProductVersion
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag is $env:GITHUB_REF_NAME, but pyproject.toml says the version is $version."
          }

      # One step, start to end: whatever the proof starts, it stops before the step is over.
      - name: Prove the installer on this machine
        shell: powershell
        env:
          CLIPPER_GITHUB_TOKEN: ${{ github.token }}
        run: .\packaging\prove.ps1 -ThrowawayMachine

      - name: Keep the installer
        uses: actions/upload-artifact@v7
        with:
          name: CS2Clipper-Setup
          path: dist/CS2Clipper-Setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CS2Clipper-Setup
          path: dist

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/CS2Clipper-Setup.exe --repo "$GITHUB_REPOSITORY" \
            --title "CS2 Clipper ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
